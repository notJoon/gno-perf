[tools]
go = "1.25.9"

[env]
GOTOOLCHAIN = "go1.25.9"

[tasks.check]
description = "Check Go version, modules, formatting, vet, tests, and build"
run = [
  "go version",
  "go mod verify",
  '''unformatted=$(git ls-files -co --exclude-standard -z -- '*.go' | xargs -0 gofmt -l) && test -z "$unformatted" || { printf '%s\n' "$unformatted"; exit 1; }''',
  "go vet ./...",
  "go test ./...",
  "go build ./...",
]

[tasks.fmt]
description = "Format Go sources"
run = "git ls-files -co --exclude-standard -z -- '*.go' | xargs -0 gofmt -w"

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.build]
description = "Build Go packages"
run = "go build -o bin/gnoperf ./cmd/gnoperf"
